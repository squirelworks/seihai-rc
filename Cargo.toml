[package]
name = "seihai-rc"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A Graal Remote Control (RC) client for server staff: players, accounts, options, files and NPC Control."
repository = "https://github.com/squirelworks/seihai-rc"
publish = false

[lib]
name = "seihai_rc"
path = "src/lib.rs"

[[bin]]
name = "seihai-rc"
path = "src/main.rs"

[dependencies]
# The window (`seihai-rc gui`), only with `--features gui`. MIT OR Apache-2.0.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
# Protocol, framing, version profiles and scripting shared with the Seihai client.
seihai-core = { git = "https://github.com/squirelworks/seihai-core", tag = "v0.8.0", default-features = false }

[dev-dependencies]
# The real listserver, for tests/real_listserver.rs. Same licence.
# Pin the listserver release on the same seihai-core tag so this
# lock file has one core (squirelworks/seihai-core#79).
seihai-listserver = { git = "https://github.com/squirelworks/seihai-listserver", tag = "v0.1.2" }
# The real gserver and NPC-server for tests/nc_live_commands.rs. Keep the
# NPC-server revision in sync with the gserver's pinned link implementation.
seihai-gserver = { git = "https://github.com/squirelworks/seihai-gserver", rev = "ae228b284227b83ad6fd272560547f0d13bf538f" }
seihai-npcserver = { git = "https://github.com/squirelworks/seihai-npcserver", tag = "v0.1.3" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# The listserver hashes and checks account passwords with argon2, which is
# very slow unoptimised.
[profile.dev.package.argon2]
opt-level = 3

[features]
# The egui window: `cargo build --features gui`, then `seihai-rc gui`.
gui = ["dep:eframe"]
