[package]
name = "seihai-rc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A Graal Remote Control (RC) client for server staff: players, accounts, options, files and NPC Control."
repository = "https://github.com/squirelworks/seihai-rc"
publish = false

[lib]
name = "seihai_rc"
path = "src/lib.rs"

[[bin]]
name = "seihai-rc"
path = "src/main.rs"

[dependencies]
# Protocol, framing, version profiles and scripting shared with the Seihai client.
seihai-core = { git = "https://github.com/squirelworks/seihai-core", rev = "dd6c88eb2e2ff4fc3177c4038869bdc4e580a132", default-features = false }

[dev-dependencies]
# The real listserver, for tests/real_listserver.rs. Same licence.
seihai-listserver = { git = "https://github.com/squirelworks/seihai-listserver", tag = "v0.1.0" }

# The listserver hashes and checks account passwords with argon2, which is
# very slow unoptimised.
[profile.dev.package.argon2]
opt-level = 3
