[package]
name = "seihai-rc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A Graal Remote Control (RC) client for server staff: players, accounts, options, files and NPC Control."
repository = "https://github.com/squirelworks/seihai-rc"
publish = false

[lib]
name = "seihai_rc"
path = "src/lib.rs"

[[bin]]
name = "seihai-rc"
path = "src/main.rs"

[dependencies]
# The window (`seihai-rc gui`), only with `--features gui`. MIT OR Apache-2.0.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
# Protocol, framing, version profiles and scripting shared with the Seihai client.
seihai-core = { git = "https://github.com/squirelworks/seihai-core", tag = "v0.2.16", default-features = false }

[dev-dependencies]
# The real listserver, for tests/real_listserver.rs. Same licence.
seihai-listserver = { git = "https://github.com/squirelworks/seihai-listserver", rev = "4ca985d2675cecff010ff60ec0a1088ff8b1d00a" }

# The listserver hashes and checks account passwords with argon2, which is
# very slow unoptimised.
[profile.dev.package.argon2]
opt-level = 3

[features]
# The egui window: `cargo build --features gui`, then `seihai-rc gui`.
gui = ["dep:eframe"]
